<!-- video.html -->
<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <title>Watch Video</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Watch videos on Sendvid"
  >

  <link
    rel="stylesheet"
    href="/theme.css"
  >

</head>

<body>

<div class="container">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <div class="video-header">

    <a href="/" class="logo">
      Sendvid
    </a>

    <a href="/" class="home-btn secondary">
      Home
    </a>

  </div>

  <!-- =====================================================
       DESKTOP CONTROLS
  ====================================================== -->

  <div class="controls-desktop">

    <div class="filters">

      <button
        class="filter-btn"
        data-sort="trending"
      >
        Trending
      </button>

      <button
        class="filter-btn"
        data-sort="popular"
      >
        Popular
      </button>

      <button
        class="filter-btn"
        data-sort="newest"
      >
        Newest
      </button>

      <button
        class="filter-btn active"
        data-sort="discover"
      >
        For you
      </button>

      <span class="divider">|</span>

      <div
        id="resultsHintDesktop"
        class="results-hint"
      ></div>

    </div>

    <!-- SEARCH -->

    <div class="search search-desktop">

      <input
        id="q-desktop"
        placeholder="Search keyword or tag"
      >

      <button
        id="clearSearchDesktop"
        aria-label="Clear search"
      >
        ×
      </button>

    </div>

  </div>

  <!-- =====================================================
       VIDEO LAYOUT
  ====================================================== -->

  <div class="video-layout">

    <!-- =================================================
         MAIN COLUMN
    ================================================== -->

    <div class="main-column">

      <div class="video-section">

        <!-- PLAYER -->

        <div
          id="playerWrapper"
          class="player-wrapper"
        ></div>

        <!-- VIDEO TITLE -->

        <h1 id="videoTitle"></h1>

        <!-- VIDEO META -->

        <div
          id="videoMeta"
          class="meta"
        ></div>

        <!-- =================================================
             SHARE ACTIONS
        ================================================== -->

        <div class="video-actions">

          <button
            id="shareBtn"
            class="share-btn"
          >
            ↗ Share This Video
          </button>

          <span
            id="shareStatus"
            class="share-status"
          ></span>

        </div>

        <!-- OPTIONAL EXTRA VIDEO INFO -->

        <div
          id="videoExtra"
          class="video-extra"
        ></div>

      </div>

    </div>

    <!-- =================================================
         SIDE COLUMN
    ================================================== -->

    <div class="side-column">

      <h2 class="upnext-title">
        Up Next
      </h2>

      <div
        id="upNextGrid"
        class="side-grid"
      ></div>

      <div class="side-ad-slot"></div>

    </div>

  </div>

  <!-- =====================================================
       FULL WIDTH DIVIDER
  ====================================================== -->

  <div class="section-divider"></div>

  <!-- =====================================================
       DISCOVER GRID
  ====================================================== -->

  <h2 class="suggested-title">
    Suggested
  </h2>

  <div
    id="discoverGrid"
    class="grid"
  ></div>

  <!-- LOADER -->

  <div
    id="loader"
    class="loader"
  >

    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>

  </div>

  <!-- LOAD MORE -->

  <button
    id="loadMore"
    class="secondary load-more"
  >
    Load More
  </button>

</div>

<!-- BACK TO TOP -->

<button
  id="backToTop"
  aria-label="Back to top"
>
  ↑
</button>

<!-- SINGLE ENTRY MODULE -->

<script
  type="module"
  src="/video.js"
></script>

</body>
</html>
