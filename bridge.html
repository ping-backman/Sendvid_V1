<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparing your video...</title>

<link rel="stylesheet" href="/theme.css">

<style>

/* ===== GLOBAL LOCK ===== */
html, body {
    height: 100%;
    overflow: hidden;
}

/* ===== LAYOUT ===== */
.bridge-content {
    max-width: 420px;
    margin: 0 auto;
    padding: 5px 12px 0;

    height: 100dvh;
    display: flex;
    flex-direction: column;
}

/* ===== TIMER ===== */
.timer-text {
    font-size: 0.95rem;
    margin-bottom: 4px;
    opacity: 0.85;
    flex-shrink: 0;
}

/* ===== CARD ===== */
.preview-card {
    background: #1a1a1a;
    border-radius: 12px;
    overflow: hidden;
    margin: 6px 0;
    border: 1px solid #333;

    flex: 1;
    display: flex;
    flex-direction: column;
}

/* ===== THUMBNAIL (MAXIMIZED) ===== */
.preview-thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center; /* change to 'top' if needed */

    flex: 1;
    background: #111;
}

/* ===== META ===== */
.preview-info {
    padding: 6px 8px;
    flex-shrink: 0;
}

#prevTitle {
    font-size: 0.8rem;
    margin-bottom: 2px;
    line-height: 1.2;
}

#prevMeta {
    font-size: 0.65rem;
    opacity: 0.7;
}

/* ===== BUTTON ===== */
#watchBtn {
    position: relative;
    width: 100%;
    padding: 10px;
    margin-top: 6px;

    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: bold;

    background: #2a2a2a;
    color: #aaa;

    cursor: not-allowed;
    overflow: hidden;

    flex-shrink: 0;
}

/* ===== LOADING WAVE ===== */
#watchBtn::before {
    content: "";
    position: absolute;
    left: -100%;
    top: 0;
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,0,85,0.5), transparent);
    animation: loadingWave 1.2s linear infinite;
}

@keyframes loadingWave {
    100% { left: 100%; }
}

/* ===== PRE-ACTIVE ===== */
#watchBtn.pre-active {
    box-shadow: 0 0 8px rgba(255,0,85,0.3);
}

/* ===== ACTIVE ===== */
#watchBtn.active {
    background: #00c853;
    color: #fff;
    cursor: pointer;
    transform: scale(1.04);
    animation: pulse 0.4s ease-in-out 2;
}

#watchBtn.active::before {
    display: none;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1.04); }
}

/* ===== SOCIAL BAR SPACE ===== */
#ad-container {
    height: 80px;
    flex-shrink: 0;
}

</style>
</head>

<body>

<div class="bridge-content">

    <p class="timer-text" id="statusText">
        Preparing your video… <span id="timer">5</span>
    </p>

    <div class="preview-card" id="previewCard" style="display:none;">
        <img id="prevThumb" class="preview-thumb" loading="eager" decoding="async">

        <div class="preview-info">
            <div id="prevTitle">Loading...</div>
            <div id="prevMeta">-- views</div>
        </div>
    </div>

    <button id="watchBtn">Please wait...</button>

    <div id="ad-container"></div>

</div>

<script type="module" src="/bridge.js"></script>

</body>
</html>
