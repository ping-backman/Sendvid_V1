<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparing your video...</title>

<link rel="stylesheet" href="/theme.css">

<style>

/* ===== GLOBAL LOCK ===== */
html, body {
    height: 100%;
    overflow: hidden;
}

/* ===== LAYOUT ===== */
.bridge-content {
    max-width: 500px;
    margin: 0 auto;
    padding: 6px 10px 0;

    height: 100dvh;
    display: flex;
    flex-direction: column;
}

/* ===== TIMER ===== */
.timer-text {
    font-size: 13px;
    margin-bottom: 6px;
    color: var(--muted);
}

/* ===== CARD OVERRIDE (USE THEME CARD) ===== */
.bridge-card {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* 🔥 THIS IS THE KEY */
.bridge-card .thumb {
    width: 100%;
    height: clamp(220px, 55vh, 420px); /* adaptive height */
    object-fit: cover;
}

/* ===== BUTTON ===== */
#watchBtn {
    position: relative;
    width: 100%;
    padding: 10px;
    margin-top: 8px;

    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;

    background: #2a2a2a;
    color: #aaa;

    cursor: not-allowed;
    overflow: hidden;
}

/* ===== LOADING WAVE ===== */
#watchBtn::before {
    content: "";
    position: absolute;
    left: -100%;
    top: 0;
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,0,85,0.5), transparent);
    animation: loadingWave 1.2s linear infinite;
}

@keyframes loadingWave {
    100% { left: 100%; }
}

/* ===== ACTIVE ===== */
#watchBtn.active {
    background: #00c853;
    color: #fff;
    cursor: pointer;
    transform: scale(1.03);
}

#watchBtn.active::before {
    display: none;
}

/* ===== SOCIAL BAR SPACE ===== */
#ad-container {
    height: 80px;
}

</style>
</head>

<body>

<div class="bridge-content">

    <p class="timer-text" id="statusText">
        Preparing your video… <span id="timer">5</span>
    </p>

    <!-- ✅ SAME CARD STRUCTURE -->
    <div class="card bridge-card" id="previewCard" style="display:none;">
        <img id="prevThumb" class="thumb">

        <div class="card-body">
            <div class="title" id="prevTitle">Loading...</div>
            <div class="meta" id="prevMeta">-- views</div>
        </div>
    </div>

    <button id="watchBtn">Please wait...</button>

    <div id="ad-container"></div>

</div>

<script type="module" src="/bridge.js"></script>

</body>
</html>
