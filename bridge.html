<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preparing your video...</title>

<link rel="stylesheet" href="/theme.css">

<style>

/* ===== GLOBAL LOCK ===== */
html, body {
    height: 100%;
    overflow: hidden; /* scroll lock */
}

/* ===== LAYOUT ===== */
.bridge-content {
    max-width: 420px;
    margin: 10px auto 0;
    padding: 5px 12px 90px;
}

/* ===== TIMER ===== */
.timer-text {
    font-size: 0.95rem;
    margin-bottom: 6px;
    opacity: 0.85;
}

/* ===== CARD ===== */
.preview-card {
    background: #1a1a1a;
    border-radius: 12px;
    overflow: hidden;
    margin: 10px 0;
    border: 1px solid #333;
}

/* ===== THUMBNAIL (ZOOMED) ===== */
.preview-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    object-position: center;
    transform: scale(1.08);
    opacity: 0.85;
    background: #111;
}

/* ===== META (COMPRESSED) ===== */
.preview-info {
    padding: 8px 10px;
}

#prevTitle {
    font-size: 0.85rem;
    margin-bottom: 2px;
    line-height: 1.2;
}

#prevMeta {
    font-size: 0.7rem;
    opacity: 0.7;
}

/* ===== BUTTON ===== */
#watchBtn {
    position: relative;
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: bold;
    background: #2a2a2a;
    color: #aaa;
    cursor: not-allowed;
    overflow: hidden;
}

/* ===== LOADING WAVE ===== */
#watchBtn::before {
    content: "";
    position: absolute;
    left: -100%;
    top: 0;
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,0,85,0.5), transparent);
    animation: loadingWave 1.2s linear infinite;
}

@keyframes loadingWave {
    100% { left: 100%; }
}

/* ===== PRE-ACTIVE ===== */
#watchBtn.pre-active {
    box-shadow: 0 0 8px rgba(255,0,85,0.3);
}

/* ===== ACTIVE (GREEN + VIBRATION) ===== */
#watchBtn.active {
    background: #00c853;
    color: #fff;
    cursor: pointer;
    transform: scale(1.04);
    animation: pulse 0.4s ease-in-out 2;
}

/* remove wave when active */
#watchBtn.active::before {
    display: none;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1.04); }
}

</style>
</head>

<body>

<div class="bridge-content">

    <p class="timer-text" id="statusText">
        Preparing your video… <span id="timer">5</span>
    </p>

    <div class="preview-card" id="previewCard" style="display:none;">
        <img id="prevThumb" class="preview-thumb" loading="eager" decoding="async">

        <div class="preview-info">
            <div id="prevTitle">Loading...</div>
            <div id="prevMeta">-- views</div>
        </div>
    </div>

    <button id="watchBtn">Please wait...</button>

    <div id="ad-container" style="margin-top: 15px;"></div>

</div>

<script type="module" src="/bridge.js"></script>

</body>
</html>
